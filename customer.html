<!DOCTYPE html>
<html>

<head>
      <title>Customer</title>
      <link rel="stylesheet" href="style.css">
</head>

<body onload="protectPage('customer')">

      <div class="container">
            <h2>Place Order</h2>

            <input type="text" id="name" placeholder="Your Name">

            <select id="service">
                  <option>Wash</option>
                  <option>Dry</option>
                  <option>Iron</option>
            </select>

            <input type="number" id="quantity" placeholder="Clothes Count">

            <button onclick="placeOrder()">Submit</button>

            <button onclick="logout()">Logout</button>

            <p id="message"></p>
      </div>

      <script src="script.js"></script>
</body>
</html>
